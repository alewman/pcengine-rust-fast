[package]
name = "pcengine-rust-fast"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A speed fork of pcengine-rust, the Rust PC Engine / TurboGrafx-16 board, held in lockstep with it"
license = "MIT"
repository = "https://github.com/alewman/pcengine-rust-fast"
readme = "README.md"
publish = false

[lib]
name = "pcengine_rust"

[dependencies]
# huc6280-rust-fast (crate huc6280): the speed fork of huc6280-rust, held in
# lockstep with it, so with huc6280-python v0.4.0 (265df88), the revision
# pcengine-python v0.2.0 pins. The parent board, pcengine-rust, uses
# huc6280-rust itself; the API is the same. By path until huc6280-rust-fast
# 90711f2 is on GitHub; then:
# huc6280 = { package = "huc6280-rust-fast", git = "https://github.com/alewman/huc6280-rust-fast", rev = "90711f2ab3511456b0fb01b32d3e96253bbba68d" }
huc6280 = { package = "huc6280-rust-fast", path = "../huc6280-rust-fast" }
# Save states (src/state.rs) and the card's identity in them.
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
flate2 = "1"
sha1 = "0.10"
# The sampling profiler (pce-profile) only.
libc = { version = "0.2", optional = true }

[features]
profile = ["dep:libc"]

[[bin]]
name = "pce-profile"
required-features = ["profile"]

# Whole-program optimisation for this crate's own binaries (the gate's and the bench's): the
# CPU core and the 65xx frame under it are other crates, and every CPU cycle crosses both
# borders. A crate that depends on this one sets its own profile (the browser pages build
# with the same two lines).
[profile.release]
debug = 1
lto = "fat"
codegen-units = 1
