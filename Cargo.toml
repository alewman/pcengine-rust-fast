[package]
name = "pcengine-rust-fast"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A speed fork of pcengine-rust, the Rust PC Engine / TurboGrafx-16 board, held in lockstep with it"
license = "MIT"
publish = false

[lib]
name = "pcengine_rust"

[dependencies]
# huc6280-rust (crate huc6280), transcribed from huc6280-python v0.3.0
# (bf20330), the revision pcengine-python v0.1.0 pins. By path while it is
# local only: repin to a GitHub revision once both are pushed.
huc6280 = { package = "huc6280-rust", path = "../huc6280-rust" }
# Save states (src/state.rs) and the card's identity in them.
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
flate2 = "1"
sha1 = "0.10"
# The sampling profiler (pce-profile) only.
libc = { version = "0.2", optional = true }

[features]
profile = ["dep:libc"]

[[bin]]
name = "pce-profile"
required-features = ["profile"]

[profile.release]
debug = 1
