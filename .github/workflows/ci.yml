# SPDX-License-Identifier: MIT
name: CI

# Kept small: main and pull requests, superseded runs cancelled. The lockstep
# gate (rungs 2-7) needs the HuCard library, which is the user's, and runs by
# hand (README). CI runs the build, the tests that need no ROM (the sockets,
# the pads, the mappers on synthetic images, the save-state round trip and
# refusals on a synthetic card) and rung 1 on Covell's CPU test, fetched by
# the pin pcengine-python uses. The CPU core, huc6280-rust-fast, comes in by
# path from a sibling clone at 73f0829 (Cargo.toml), cloned below; that commit
# is not on GitHub yet, so CI fails at the clone until huc6280-rust-fast is
# pushed (then Cargo.toml may go back to the git pin it names, and the clone
# steps can go).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: huc6280-rust-fast 73f0829 beside this repository
        run: |
          git clone -q https://github.com/alewman/huc6280-rust-fast ../huc6280-rust-fast
          git -C ../huc6280-rust-fast checkout -q 73f08298fe2dad66973cfe75c6b19a3ea95579d5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  covell:
    name: "rung 1: Covell's CPU test runs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: huc6280-rust-fast 73f0829 beside this repository
        run: |
          git clone -q https://github.com/alewman/huc6280-rust-fast ../huc6280-rust-fast
          git -C ../huc6280-rust-fast checkout -q 73f08298fe2dad66973cfe75c6b19a3ea95579d5
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/fetch_covell.sh
      - run: scripts/rung1.sh external/covell/CPU_Test_10.pce
